[project]
name = "killtimer"
version = "0.4.1"
description = "Closes application after specified work interval"
license = "GPL-3.0-or-later"
readme = "README.md"
authors = [
    { name = "Paweł Żukowski", email = "p.z.idlecode@gmail.com" },
]
requires-python = ">=3.11,<4"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=12.4.3,<13",
    "desktop-notifier>=3.4.0,<4",
    "pytimeparse>=1.1.8,<2",
    "humanfriendly>=10.0,<11",
    "PyAudio>=0.2.13,<0.3",
]

[project.urls]
Homepage = "https://github.com/idle-code/killtimer"
Repository = "https://github.com/idle-code/killtimer"
Issues = "https://github.com/idle-code/killtimer/issues"

[project.scripts]
killtimer = "killtimer.main:main"
killtimer-stats = "killtimer.stats:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
